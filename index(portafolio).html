<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vicente — Portafolio</title>
<meta name="description" content="Portafolio de proyectos web de sonido, código y diseño.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root{
    --hormigon:  #E4E5E0;
    --panel:     #EDEEE9;
    --tinta:     #14161A;
    --gris:      #6B7078;
    --linea:     rgba(20,22,26,.16);
    --senal:     #1B34E0;
    --senal-luz: rgba(27,52,224,.10);

    --display: 'Archivo', system-ui, sans-serif;
    --texto:   'Instrument Sans', system-ui, sans-serif;
    --dato:    'JetBrains Mono', ui-monospace, monospace;

    --borde-max: 1180px;
  }

  *,*::before,*::after{ box-sizing:border-box; }

  html{ scroll-behavior:smooth; }

  body{
    margin:0;
    background:var(--hormigon);
    color:var(--tinta);
    font-family:var(--texto);
    font-size:17px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }

  .envoltura{
    max-width:var(--borde-max);
    margin:0 auto;
    padding:0 28px;
  }

  /* ---------- etiquetas de dato ---------- */
  .dato{
    font-family:var(--dato);
    font-size:12px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--gris);
  }

  /* ---------- portada ---------- */
  .portada{
    padding:72px 0 56px;
    border-bottom:1px solid var(--linea);
  }

  .portada__eyebrow{
    display:flex;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
    margin-bottom:44px;
  }

  .portada h1{
    font-family:var(--display);
    font-variation-settings:'wdth' 118;
    font-weight:800;
    font-size:clamp(2.6rem, 8.5vw, 6.2rem);
    line-height:.94;
    letter-spacing:-.025em;
    margin:0 0 28px;
    max-width:14ch;
  }

  .portada h1 em{
    font-style:normal;
    color:var(--senal);
  }

  .portada__intro{
    max-width:52ch;
    font-size:1.06rem;
    color:#31353B;
    margin:0 0 36px;
  }

  .portada__meta{
    display:flex;
    gap:10px 26px;
    flex-wrap:wrap;
  }

  /* ---------- onda de la portada ---------- */
  .onda-portada{
    width:100%;
    height:110px;
    display:block;
    margin-top:48px;
  }
  .onda-portada polyline{
    fill:none;
    stroke:var(--senal);
    stroke-width:1.4;
    stroke-linecap:round;
    vector-effect:non-scaling-stroke;
  }

  /* ---------- sección proyectos ---------- */
  .seccion__cabecera{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:16px;
    padding:40px 0 8px;
  }

  .lista{
    list-style:none;
    margin:0;
    padding:0;
  }

  .proyecto{
    position:relative;
    display:grid;
    grid-template-columns:1fr 300px;
    gap:12px 48px;
    align-items:center;
    padding:34px 0;
    border-top:1px solid var(--linea);
    transition:background-color .28s ease;
  }
  .proyecto:last-child{ border-bottom:1px solid var(--linea); }

  .proyecto::before{
    content:"";
    position:absolute;
    inset:0 -20px;
    background:transparent;
    transition:background-color .28s ease;
    z-index:0;
  }
  .proyecto:hover::before,
  .proyecto:focus-within::before{ background:var(--senal-luz); }

  .proyecto > *{ position:relative; z-index:1; }

  .proyecto__texto{ min-width:0; }

  .proyecto__stack{
    display:block;
    margin-bottom:10px;
  }

  .proyecto__titulo{
    font-family:var(--display);
    font-variation-settings:'wdth' 108;
    font-weight:700;
    font-size:clamp(1.4rem, 3.2vw, 2.05rem);
    line-height:1.1;
    letter-spacing:-.015em;
    margin:0 0 10px;
  }

  .proyecto__titulo a{
    color:inherit;
    text-decoration:none;
  }
  /* el título cubre toda la fila: hace clickeable el bloque completo */
  .proyecto__titulo a::after{
    content:"";
    position:absolute;
    inset:0;
    z-index:1;
  }
  .proyecto:hover .proyecto__titulo a,
  .proyecto__titulo a:focus-visible{ color:var(--senal); }

  .proyecto__desc{
    margin:0;
    max-width:56ch;
    color:#3A3E45;
    font-size:.97rem;
  }

  .proyecto__aparte{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:14px;
  }

  .onda{
    width:100%;
    height:52px;
    display:block;
  }
  .onda polyline{
    fill:none;
    stroke:var(--gris);
    stroke-width:1.2;
    stroke-linecap:round;
    vector-effect:non-scaling-stroke;
    transition:stroke .28s ease;
  }
  .proyecto:hover .onda polyline,
  .proyecto:focus-within .onda polyline{ stroke:var(--senal); }

  .enlaces{
    display:flex;
    gap:8px;
    position:relative;
    z-index:2;
  }

  .boton{
    font-family:var(--dato);
    font-size:12px;
    letter-spacing:.06em;
    text-transform:uppercase;
    text-decoration:none;
    color:var(--tinta);
    background:transparent;
    border:1px solid var(--linea);
    border-radius:999px;
    padding:8px 16px;
    white-space:nowrap;
    transition:background-color .2s ease, color .2s ease, border-color .2s ease;
  }
  .boton:hover{
    background:var(--tinta);
    color:var(--panel);
    border-color:var(--tinta);
  }
  .boton--principal{
    background:var(--senal);
    border-color:var(--senal);
    color:#fff;
  }
  .boton--principal:hover{
    background:var(--tinta);
    border-color:var(--tinta);
    color:#fff;
  }
  .boton--inactivo{
    color:var(--gris);
    pointer-events:none;
  }

  /* ---------- pie ---------- */
  .pie{
    padding:64px 0 72px;
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:24px;
    flex-wrap:wrap;
  }
  .pie a{ color:var(--tinta); }
  .pie__frase{
    font-family:var(--display);
    font-variation-settings:'wdth' 112;
    font-weight:600;
    font-size:clamp(1.3rem, 3.4vw, 2rem);
    line-height:1.05;
    letter-spacing:-.02em;
    margin:0;
    max-width:16ch;
  }

  /* ---------- accesibilidad ---------- */
  a:focus-visible,
  .boton:focus-visible{
    outline:2px solid var(--senal);
    outline-offset:3px;
    border-radius:4px;
  }

  /* ---------- responsive ---------- */
  @media (max-width:820px){
    .proyecto{
      grid-template-columns:1fr;
      gap:18px;
      padding:28px 0;
    }
    .proyecto__aparte{
      align-items:flex-start;
      width:100%;
    }
    .onda{ height:42px; }
    .envoltura{ padding:0 20px; }
    .portada{ padding:48px 0 40px; }
  }

  @media (prefers-reduced-motion:reduce){
    *{ animation:none !important; transition:none !important; }
    html{ scroll-behavior:auto; }
  }
</style>
</head>

<body>

<header class="portada">
  <div class="envoltura">
    <div class="portada__eyebrow">
      <span class="dato" id="eyebrow-nombre"></span>
      <span class="dato" id="eyebrow-lugar"></span>
    </div>

    <h1 id="titular"></h1>
    <p class="portada__intro" id="intro"></p>

    <div class="portada__meta" id="meta"></div>

    <svg class="onda-portada" id="onda-portada" viewBox="0 0 1000 110" preserveAspectRatio="none" aria-hidden="true">
      <polyline id="onda-portada-linea" points=""></polyline>
    </svg>
  </div>
</header>

<main>
  <section class="envoltura" id="proyectos">
    <div class="seccion__cabecera">
      <span class="dato">Proyectos</span>
      <span class="dato" id="conteo"></span>
    </div>
    <ul class="lista" id="lista-proyectos"></ul>
  </section>
</main>

<footer class="envoltura pie">
  <p class="pie__frase" id="frase-pie"></p>
  <div class="enlaces" id="enlaces-pie"></div>
</footer>

<script>
/* ============================================================
   1. CONFIGURACIÓN — esto es lo único que tienes que editar
   ============================================================ */

const PERFIL = {
  nombre:    "Vicente",
  usuario:   "v1ch0bntz",
  correo:    "tucorreo@ejemplo.com",       // <- tu correo
  lugar:     "Santiago, Chile",
  titular:   ["Programo cosas", "que <em>suenan</em>."],   // dos líneas
  intro:     "Proyectos web de audio, imagen y datos, hechos en HTML, JavaScript y p5.js. Casi todos empiezan con una pregunta sobre sonido y terminan corriendo en el navegador.",
  meta:      ["Ingeniería Comercial + Diseño, UAI", "HTML · JavaScript · p5.js · Web Audio"],
  frasePie:  "¿Trabajamos en algo?"
};

/* Cada proyecto genera una fila con su propia onda.
   - demo:   URL de GitHub Pages (deja "" si todavía no está publicado)
   - repo:   URL del repositorio (deja "" para ocultar el botón)
   - stack:  se muestra como etiqueta arriba del título
   Opcionales, para proyectos que no son páginas web:
   - etiquetaDemo / etiquetaRepo: cambian el texto de los botones            */

const PROYECTOS = [
  {
    titulo: "Sonificador de imágenes",
    stack:  "HTML · Web Audio API · Canvas",
    desc:   "Lee los píxeles de una imagen y los convierte en música: el RGB define las notas, la escala y el ritmo. Batería, bajo y melodía salen todos de la misma imagen.",
    demo:   "https://v1ch0bntz.github.io/Sonificacion/",
    repo:   "https://github.com/v1ch0bntz/Sonificacion"
  },
  {
    titulo: "El sonido de los géneros",
    stack:  "HTML · JavaScript · Audio",
    desc:   "Juego de reconocimiento auditivo con dos modos: entrenamiento libre y partida contrarreloj para identificar diez géneros en diez segundos.",
    demo:   "https://v1ch0bntz.github.io/Juego-Generos-Musicales/",
    repo:   "https://github.com/v1ch0bntz/Juego-Generos-Musicales"
  },
  {
    titulo: "Sonógrafo",
    stack:  "p5.js · Web Speech API · p5.sound",
    desc:   "Transcribe lo que dice el micrófono y muestra en paralelo los datos del audio: decibeles, timbre y variación de la señal.",
    demo:   "https://v1ch0bntz.github.io/Sonografo/",
    repo:   "https://github.com/v1ch0bntz/Sonografo"
  },
  {
    titulo: "Lámina de interfaz",
    stack:  "Diseño · Análisis de entradas y salidas",
    desc:   "Mapeo de un smartphone como interfaz: cada entrada y salida clasificada por canal sonoro, físico o gráfico, del micrófono a la háptica.",
    demo:   "lamina-interfaz.html",
    etiquetaDemo: "Ver lámina",
    repo:   "",
    etiquetaRepo: "Archivos"
  },
  {
    titulo: "Efectos en tiempo real",
    stack:  "Max 9 · MSP · Audio del sistema",
    desc:   "Procesa en vivo lo que esté sonando en el computador: reverb y filtros high-pass y low-pass montados como inserts con mezcla dry/wet, para que subir un efecto no suba el volumen general.",
    demo:   "https://youtu.be/2lSsNh3nFrE",
    etiquetaDemo: "Ver video",
    repo:   "https://github.com/v1ch0bntz/efectos-tiempo-real-max",
    etiquetaRepo: "Patch"
  }
];

/* ============================================================
   2. RENDER — de aquí para abajo normalmente no hay que tocar
   ============================================================ */

/* Ruido pseudoaleatorio con semilla: la misma palabra produce
   siempre la misma onda, así cada proyecto tiene una firma estable. */
function semilla(texto){
  let h = 2166136261;
  for (let i = 0; i < texto.length; i++){
    h ^= texto.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

function generador(s){
  let estado = s || 1;
  return function(){
    estado = (Math.imul(estado, 1664525) + 1013904223) >>> 0;
    return estado / 4294967296;
  };
}

function puntosOnda(texto, ancho, alto, puntos){
  const azar = generador(semilla(texto));
  const capas = [];
  for (let i = 0; i < 3; i++){
    capas.push({
      frec: 1 + azar() * 7,
      fase: azar() * Math.PI * 2,
      amp:  0.25 + azar() * 0.55
    });
  }
  const salida = [];
  for (let i = 0; i <= puntos; i++){
    const t = i / puntos;
    let y = 0;
    for (const c of capas){
      y += Math.sin(t * Math.PI * 2 * c.frec + c.fase) * c.amp;
    }
    /* sobre corta los bordes para que la onda entre y salga en silencio */
    const sobre = Math.sin(t * Math.PI);
    y = (y / capas.length) * sobre;
    salida.push((t * ancho).toFixed(1) + "," + (alto / 2 + y * (alto / 2) * 0.9).toFixed(1));
  }
  return salida.join(" ");
}

function crearOnda(texto){
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("class", "onda");
  svg.setAttribute("viewBox", "0 0 300 52");
  svg.setAttribute("preserveAspectRatio", "none");
  svg.setAttribute("aria-hidden", "true");
  const linea = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
  linea.setAttribute("points", puntosOnda(texto, 300, 52, 160));
  svg.appendChild(linea);
  return svg;
}

function boton(texto, url, clase){
  const a = document.createElement("a");
  a.className = "boton " + (clase || "");
  a.textContent = texto;
  if (url){
    a.href = url;
    a.target = "_blank";
    a.rel = "noopener";
  } else {
    a.className += " boton--inactivo";
    a.setAttribute("aria-disabled", "true");
    a.href = "#";
  }
  return a;
}

/* --- portada --- */
document.getElementById("eyebrow-nombre").textContent = "Portafolio — " + PERFIL.nombre;
document.getElementById("eyebrow-lugar").textContent = PERFIL.lugar;
document.getElementById("titular").innerHTML = PERFIL.titular.join("<br>");
document.getElementById("intro").textContent = PERFIL.intro;
document.getElementById("frase-pie").textContent = PERFIL.frasePie;

const meta = document.getElementById("meta");
PERFIL.meta.forEach(function(m){
  const span = document.createElement("span");
  span.className = "dato";
  span.textContent = m;
  meta.appendChild(span);
});

document.getElementById("onda-portada-linea")
  .setAttribute("points", puntosOnda(PERFIL.nombre + PROYECTOS.length, 1000, 110, 420));

/* --- proyectos --- */
const lista = document.getElementById("lista-proyectos");

PROYECTOS.forEach(function(p){
  const fila = document.createElement("li");
  fila.className = "proyecto";

  const texto = document.createElement("div");
  texto.className = "proyecto__texto";

  const stack = document.createElement("span");
  stack.className = "dato proyecto__stack";
  stack.textContent = p.stack;

  const titulo = document.createElement("h3");
  titulo.className = "proyecto__titulo";
  const enlace = document.createElement("a");
  enlace.href = p.demo || p.repo;
  enlace.target = "_blank";
  enlace.rel = "noopener";
  enlace.textContent = p.titulo;
  titulo.appendChild(enlace);

  const desc = document.createElement("p");
  desc.className = "proyecto__desc";
  desc.textContent = p.desc;

  texto.append(stack, titulo, desc);

  const aparte = document.createElement("div");
  aparte.className = "proyecto__aparte";
  aparte.appendChild(crearOnda(p.titulo));

  const enlaces = document.createElement("div");
  enlaces.className = "enlaces";
  enlaces.appendChild(boton(p.demo ? (p.etiquetaDemo || "Abrir proyecto") : "Sin demo", p.demo, "boton--principal"));
  if (p.repo) enlaces.appendChild(boton(p.etiquetaRepo || "Código", p.repo));
  aparte.appendChild(enlaces);

  fila.append(texto, aparte);
  lista.appendChild(fila);
});

document.getElementById("conteo").textContent =
  PROYECTOS.length + (PROYECTOS.length === 1 ? " proyecto" : " proyectos");

/* --- pie --- */
const pie = document.getElementById("enlaces-pie");
pie.appendChild(boton("GitHub", "https://github.com/" + PERFIL.usuario, "boton--principal"));
pie.appendChild(boton("Escríbeme", "mailto:" + PERFIL.correo));
</script>

</body>
</html>
